name = "molido-sub"
main = "sub-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "molido-reports"
database_id = "07132224-99e6-4446-b48d-743258b426e8"

[triggers]
crons = ["*/15 * * * *"]

# 5% of requests logged (Workers Logs) so per-path load can be queried; free plan includes 200k events/day.
[observability]
enabled = true
head_sampling_rate = 0.05

# Free ntfy.sh topic the apps listen to while open; owner saves are pushed there signed with the
# LIVE_SIGN_KEY secret (ECDSA P-256 JWK). The apps hold the public key.
[vars]
LIVE_TOPIC = "molidovpn-live-971a1da8ec4af75c"
