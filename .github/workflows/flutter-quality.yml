name: Flutter quality

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "tools/android-update-e2e.py"
      - ".github/workflows/flutter-quality.yml"
  push:
    branches: [main, security/redacted-diagnostics-20261105]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "tools/android-update-e2e.py"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate Android update E2E Python syntax
        run: python3 -m py_compile tools/android-update-e2e.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Retry transient runner/network failures twice. A persistent code/test
      # failure still fails the job and remains visible in the PR checks.
      - name: Toolchain (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter --version; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Toolchain check failed; retrying ($attempt/3)..." >&2; sleep 10; fi
          done
          exit 1
      - name: Resolve dependencies (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Dependency resolution failed; retrying ($attempt/3)..." >&2; sleep 15; fi
          done
          exit 1
      - name: Static analysis (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter analyze; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Static analysis failed; retrying ($attempt/3)..." >&2; sleep 10; fi
          done
          exit 1
      - name: Unit and widget tests (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter test --reporter expanded; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Flutter tests failed; retrying ($attempt/3)..." >&2; sleep 15; fi
          done
          exit 1

  android-update-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Download previous signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v4.0.8 -R "$GITHUB_REPOSITORY" -p 'MolidoVPN-android-universal.apk' -O old.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify in-app update HTTPS hand-off
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/android-update-e2e.py old.apk 4.0.9
      - name: Upload update screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-update-e2e-${{ github.run_id }}
          path: shots/*.png
          if-no-files-found: ignore
