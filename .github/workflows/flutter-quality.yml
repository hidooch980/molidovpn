name: Flutter quality

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "android-app/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-quality.yml"
  push:
    branches: [main, security/redacted-diagnostics-20261105]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Retry transient runner/network failures twice. A persistent code/test
      # failure still fails the job and remains visible in the PR checks.
      - name: Toolchain (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter --version; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Toolchain check failed; retrying ($attempt/3)..." >&2; sleep 10; fi
          done
          exit 1
      - name: Resolve dependencies (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Dependency resolution failed; retrying ($attempt/3)..." >&2; sleep 15; fi
          done
          exit 1
      - name: Static analysis (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter analyze; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Static analysis failed; retrying ($attempt/3)..." >&2; sleep 10; fi
          done
          exit 1
      - name: Unit and widget tests (automatic retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter test --reporter expanded; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Flutter tests failed; retrying ($attempt/3)..." >&2; sleep 15; fi
          done
          exit 1

  android-native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch pinned Android runtime binaries (SHA-256 verified)
        run: bash tools/fetch-binaries.sh
      - name: Compile Android Kotlin sources (native Rust core excluded)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin \
            -x buildRustCoreArm64V8a \
            -x buildRustCoreArmeabiV7a \
            -x buildRustCoreX86_64
