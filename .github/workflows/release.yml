name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 3.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit tests (including the live subscription)
        run: |
          curl -fsSL https://raw.githubusercontent.com/hidooch980/vpn-sub/sub/sub.txt -o sub.txt || true
          SUB_FILE=$PWD/sub.txt flutter test

  android:
    # Android app = MolidoVPN Android from hidooch980/molidovpn-android.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hidooch980/molidovpn-android
          path: native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed legacy 'tools' package, which now fails.
          packages: platform-tools
      - name: NDK and CMake
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Rust toolchain for the core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/core/aether -> target
      - name: Prebuilt Psiphon, Tor and Xray (our mirror, checksum verified)
        working-directory: native
        run: bash tools/fetch-binaries.sh
      - name: Build APKs
        working-directory: native
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon             -PtargetAbi=arm64-v8a,armeabi-v7a             -PaetheryKeystore=release.keystore             -PmolidoVersionCode=$((30000 + ${{ github.run_number }}))             -PmolidoVersionName=$VERSION
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*)   cp "$f" ../dist/MolidoVPN-android-arm64.apk ;;
              *armeabi-v7a*) cp "$f" ../dist/MolidoVPN-android-armv7.apk ;;
              *universal*)   cp "$f" ../dist/MolidoVPN-android-universal.apk ;;
            esac
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  android-smoke:
    # Informational only (does not gate the release).
    # Installs the universal APK on an emulator, launches it, connects the VPN and loads a page through it.
    # Any crash or failed connection stops the release.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r dist/MolidoVPN-android-universal.apk
            adb logcat -c
            adb shell monkey -p com.mobin.mobin_vpn -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt || true
            adb shell pidof com.mobin.mobin_vpn || { echo "app is not running"; grep -A20 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; }
            if grep -q "FATAL EXCEPTION" logcat.txt; then grep -A30 "FATAL EXCEPTION" logcat.txt | head -80; exit 1; fi
            echo "app launched and is still running after 25 s"
            bash tools/connect-test.sh || { echo "::error::app did not connect and load a page through the tunnel"; exit 1; }
      - name: Publish emulator screenshots (branch previews-android)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b previews-android
          git config user.name molido-bot && git config user.email molido-bot@users.noreply.github.com
          git add . && git commit -qm "Android screenshots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews-android

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load core pins (tools/core-pins.json, rewritten by core-updates)
        shell: pwsh
        run: |
          $pins = Get-Content tools/core-pins.json -Raw | ConvertFrom-Json
          foreach ($p in $pins.PSObject.Properties) { "$($p.Name)=$($p.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build windows --release --build-name $env:VERSION --build-number ${{ github.run_number }}
      - name: Bundle sing-box (latest patch of SINGBOX_WINDOWS_MINOR)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R SagerNet/sing-box --exclude-pre-releases --limit 100 --json tagName \
                --jq '[.[].tagName | select(startswith("v'"$SINGBOX_WINDOWS_MINOR"'."))][0]')
          VER=${TAG#v}
          gh release download "$TAG" -R SagerNet/sing-box -p "sing-box-${VER}-windows-amd64.zip" -O sb.zip
          unzip -q sb.zip
          cp "sing-box-${VER}-windows-amd64/sing-box.exe" build/windows/x64/runner/Release/
      - name: Bundle Xray-core for XHTTP servers (pinned, SHA-256 verified)
        shell: pwsh
        # sing-box 1.12 has no XHTTP transport; the app runs XHTTP nodes through a local Xray SOCKS inbound.
        # XRAY_VERSION / XRAY_SHA256 come from tools/core-pins.json.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $rel = 'build/windows/x64/runner/Release'
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile xray.zip
          $h = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:XRAY_SHA256) { throw "Xray SHA-256 mismatch: $h" }
          Expand-Archive xray.zip -DestinationPath xray-unzip
          New-Item -ItemType Directory -Force "$rel/xray" | Out-Null
          foreach ($f in 'xray.exe', 'geoip.dat', 'geosite.dat', 'LICENSE') {
            if (Test-Path "xray-unzip/$f") { Copy-Item "xray-unzip/$f" "$rel/xray/" }
          }
          & "$rel/xray/xray.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'xray.exe does not run' }
      - name: Bundle Psiphon and Tor (pinned, SHA-256 verified)
        shell: pwsh
        # PSIPHON_COMMIT / PSIPHON_SHA256 (Windows i686 ConsoleClient), TOR_BROWSER_VERSION and
        # TOR_BUNDLE_SHA256 (empty = use the Tor Project's published checksum) come from tools/core-pins.json.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $rel = 'build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Force "$rel/psiphon", "$rel/tor", teb | Out-Null

          $psi = "$rel/psiphon/psiphon-tunnel-core.exe"
          Invoke-WebRequest "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/$env:PSIPHON_COMMIT/windows/psiphon-tunnel-core-i686.exe" -OutFile $psi
          $h = (Get-FileHash $psi -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:PSIPHON_SHA256) { throw "Psiphon SHA-256 mismatch: $h" }
          Copy-Item windows/psiphon/server_entries.txt "$rel/psiphon/"

          # Use the pinned version if the Tor Project still has it, otherwise the newest stable one on dist.
          $torVer = $env:TOR_BROWSER_VERSION
          $base = "https://archive.torproject.org/tor-package-archive/torbrowser/$torVer"
          $name = "tor-expert-bundle-windows-x86_64-$torVer.tar.gz"
          try { Invoke-WebRequest "$base/$name" -OutFile $name } catch {
            $index = (Invoke-WebRequest 'https://dist.torproject.org/torbrowser/').Content
            $torVer = [regex]::Matches($index, 'href="(\d+\.\d+(?:\.\d+)?)/"') | ForEach-Object { $_.Groups[1].Value } |
              Sort-Object { [version]$_ } | Select-Object -Last 1
            Write-Output "pinned Tor $env:TOR_BROWSER_VERSION unavailable, using latest stable $torVer"
            $base = "https://dist.torproject.org/torbrowser/$torVer"
            $name = "tor-expert-bundle-windows-x86_64-$torVer.tar.gz"
            Invoke-WebRequest "$base/$name" -OutFile $name
          }
          $expected = $env:TOR_BUNDLE_SHA256
          if (-not $expected) {
            foreach ($sums in 'sha256sums-unsigned-build.txt', 'sha256sums-signed-build.txt') {
              try { Invoke-WebRequest "$base/$sums" -OutFile tor-sums.txt } catch { continue }
              $line = Select-String -Path tor-sums.txt -SimpleMatch $name | Select-Object -First 1
              if ($line) { $expected = ($line.Line.Trim() -split '\s+')[0]; break }
            }
          }
          if (-not $expected) { throw "No published SHA-256 for $name" }
          $h = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          Write-Host "Tor bundle $name sha256=$h"
          if ($h -ne $expected.ToLower()) { throw "Tor bundle SHA-256 mismatch: $h vs $expected" }
          tar -xzf $name -C teb
          $torExe = Get-ChildItem teb -Recurse -Filter tor.exe | Select-Object -First 1
          $lyre = Get-ChildItem teb -Recurse -Filter lyrebird.exe | Select-Object -First 1
          if (-not $torExe -or -not $lyre) { throw 'tor.exe or lyrebird.exe missing from the expert bundle' }
          # tor.exe with its DLLs, lyrebird.exe next to it (torrc names it without a path), GeoIP files.
          Get-ChildItem $torExe.DirectoryName -File | Copy-Item -Destination "$rel/tor/"
          Copy-Item $lyre.FullName "$rel/tor/"
          foreach ($g in 'geoip', 'geoip6') {
            $f = Get-ChildItem teb -Recurse -File -Filter $g | Select-Object -First 1
            if ($f) { Copy-Item $f.FullName "$rel/tor/" }
          }
          & "$rel/tor/tor.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'tor.exe does not run' }
          Get-ChildItem "$rel/psiphon", "$rel/tor"
      - name: Bundle AmneziaWG (pinned MSI, SHA-256 verified)
        shell: pwsh
        # AWG_VERSION / AWG_MSI_SHA256 come from tools/core-pins.json.
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $rel = 'build/windows/x64/runner/Release'
          $msi = "amneziawg-amd64-$env:AWG_VERSION.msi"
          Invoke-WebRequest "https://github.com/amnezia-vpn/amneziawg-windows-client/releases/download/$env:AWG_VERSION/$msi" -OutFile $msi
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:AWG_MSI_SHA256) { throw "AmneziaWG MSI SHA-256 mismatch: $h" }
          # Administrative install only unpacks the files (nothing is installed on the runner).
          $out = Join-Path $PWD 'awg-msi'
          $p = Start-Process msiexec.exe -ArgumentList '/a', (Resolve-Path $msi).Path, '/qn', "TARGETDIR=$out" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed: $($p.ExitCode)" }
          $exe = Get-ChildItem $out -Recurse -Filter amneziawg.exe | Select-Object -First 1
          if (-not $exe) { throw 'amneziawg.exe missing from the MSI' }
          New-Item -ItemType Directory -Force "$rel/amneziawg" | Out-Null
          Get-ChildItem $exe.DirectoryName -File | Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination "$rel/amneziawg/"
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "amneziawg.exe signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          Get-ChildItem "$rel/amneziawg"
      - name: Validate the config shapes the app generates (TUN, fragment, DNS)
        shell: bash
        run: |
          cat > app-config-test.json <<'JSON'
          {
            "log": {"level": "warn"},
            "dns": {"servers": [{"type": "local", "tag": "local"},
                                {"type": "https", "tag": "remote", "server": "1.1.1.1", "detour": "proxy"}],
                    "final": "remote", "strategy": "prefer_ipv4"},
            "inbounds": [
              {"type": "mixed", "tag": "in", "listen": "127.0.0.1", "listen_port": 10808},
              {"type": "tun", "tag": "tun", "interface_name": "MobinVPN",
               "address": ["172.19.0.1/30", "fdfe:dcba:9876::1/126"], "auto_route": true, "strict_route": true, "stack": "mixed"}
            ],
            "outbounds": [
              {"type": "vless", "tag": "proxy", "server": "example.com", "server_port": 443,
               "uuid": "11111111-1111-1111-1111-111111111111", "packet_encoding": "xudp",
               "tls": {"enabled": true, "server_name": "example.com", "record_fragment": true,
                       "utls": {"enabled": true, "fingerprint": "chrome"}},
               "transport": {"type": "ws", "path": "/"}},
              {"type": "direct", "tag": "direct"}
            ],
            "route": {"rules": [{"action": "sniff"}, {"protocol": "dns", "action": "hijack-dns"},
                                {"ip_is_private": true, "outbound": "direct"},
                                {"domain_suffix": ["ir"], "outbound": "direct"}],
                      "final": "proxy", "auto_detect_interface": true, "default_domain_resolver": "local"},
            "experimental": {"clash_api": {"external_controller": "127.0.0.1:9090"}}
          }
          JSON
          build/windows/x64/runner/Release/sing-box.exe check -c app-config-test.json
          cat > dns-only-test.json <<'JSON'
          {
            "log": {"level": "warn"},
            "dns": {"servers": [{"type": "udp", "tag": "gaming", "server": "10.202.10.10"},
                                {"type": "local", "tag": "local"}],
                    "final": "gaming", "strategy": "prefer_ipv4"},
            "inbounds": [{"type": "tun", "tag": "tun", "interface_name": "MobinVPN", "mtu": 1420,
                          "address": ["172.19.0.1/30", "fdfe:dcba:9876::1/126"], "auto_route": true,
                          "strict_route": true, "stack": "mixed"}],
            "outbounds": [{"type": "direct", "tag": "direct"}],
            "route": {"rules": [{"action": "sniff"}, {"protocol": "dns", "action": "hijack-dns"},
                                {"port": 53, "action": "hijack-dns"}],
                      "final": "direct", "auto_detect_interface": true, "default_domain_resolver": "local"},
            "experimental": {"clash_api": {"external_controller": "127.0.0.1:9090"}}
          }
          JSON
          build/windows/x64/runner/Release/sing-box.exe check -c dns-only-test.json
      - name: Zip
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/MolidoVPN-windows-x64.zip
      - name: Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iss = @"
          [Setup]
          AppId={{8F3C2A1E-6B4D-4F7A-9C1E-2D5B7A9E4C10}
          AppName=MolidoVPN
          AppVersion=$env:VERSION
          AppPublisher=MolidoVPN
          DefaultDirName={localappdata}/Programs/MolidoVPN
          PrivilegesRequired=lowest
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=MolidoVPN-windows-setup
          SetupIconFile=windows/runner/resources/app_icon.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          [Languages]
          Name: "en"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "Desktop shortcut"; Flags: checkedonce
          [Files]
          Source: "build/windows/x64/runner/Release/*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\MolidoVPN"; Filename: "{app}/mobin_vpn.exe"
          Name: "{autodesktop}\MolidoVPN"; Filename: "{app}/mobin_vpn.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}/mobin_vpn.exe"; Description: "Start MolidoVPN"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path molido.iss -Value $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" molido.iss
      - name: Screenshots of the Windows app (branch previews-windows)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $exe = Get-ChildItem build/windows/x64/runner/Release -Filter *.exe | Where-Object { $_.Name -notmatch 'sing-box|psiphon|tor|lyrebird' } | Select-Object -First 1
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 25
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/shots/windows-home.png")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Set-Location shots
          git init -q -b previews-windows
          git config user.name molido-bot; git config user.email molido-bot@users.noreply.github.com
          git add .; git commit -qm "Windows screenshots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, android-smoke, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: win
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hidooch980/molidovpn-android
          path: native
          fetch-depth: 0
      - name: Changelog (never fails the release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(gh release view -R ${{ github.repository }} --json publishedAt -q .publishedAt 2>/dev/null || echo "3 days ago")
          python3 win/tools/changelog.py "$VERSION" "$SINCE" win native dist/changelog.json notes.md || true
      - name: Changelog fallback
        id: notes
        run: |
          [ -s dist/changelog.json ] || echo "{\"version\":\"$VERSION\",\"items\":[{\"text\":\"بهبود پایداری و سرعت\",\"platform\":\"all\"}]}" > dist/changelog.json
          [ -s notes.md ] || printf '## تغییرات این نسخه\n- بهبود پایداری و سرعت\n\n' > notes.md
          cat notes.md
          { echo 'md<<CLEOF'; cat notes.md; echo CLEOF; } >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MolidoVPN ${{ env.VERSION }}
          make_latest: true
          files: dist/*
          body: |
            ${{ steps.notes.outputs.md }}
            ## دانلود
            | دستگاه | فایل |
            |---|---|
            | اندروید (بیشتر گوشی‌ها) | `MolidoVPN-android-arm64.apk` |
            | اندروید قدیمی | `MolidoVPN-android-armv7.apk` |
            | اگر مطمئن نیستید | `MolidoVPN-android-universal.apk` |
            | ویندوز ۱۰ و ۱۱ (نصب‌کننده) | `MolidoVPN-windows-setup.exe` |
            | ویندوز، نسخه‌ی بدون نصب | `MolidoVPN-windows-x64.zip` ← از حالت فشرده خارج کنید و `mobin_vpn.exe` (MolidoVPN) را اجرا کنید |

            ## استفاده
            - دکمه‌ی بزرگ را بزنید. در حالت **هوشمند** برنامه سرورها را با اینترنت خودتان می‌سنجد و به سریع‌ترین وصل می‌شود.
            - کارت «موقعیت» برای انتخاب کشور، دکمه‌ی 🖧 برای همه‌ی سرورها و تست پینگ، دکمه‌ی ⚙ برای تنظیمات پیشرفته.
            - برنامه خودش نسخه‌ی جدید را پیدا و نصب می‌کند.

      - name: Pre-warm download cache
        continue-on-error: true
        run: |
          for f in MolidoVPN-android-arm64.apk MolidoVPN-android-armv7.apk MolidoVPN-android-universal.apk MolidoVPN-windows-setup.exe MolidoVPN-windows-x64.zip; do
            curl -sS -o /dev/null --max-time 600 -w "$f %{http_code} %{size_download}\n" "https://molido-sub.hidooch980.workers.dev/app/$f" || true
          done

  android-update-e2e:
    # After publishing: install the PREVIOUS release on an emulator and let its in-app updater
    # download and install the release that was just published, exactly like a user would.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Previous release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release list -R "$GITHUB_REPOSITORY" -L 2 --json tagName -q '.[1].tagName')
          echo "previous release: $PREV"
          gh release download "$PREV" -R "$GITHUB_REPOSITORY" -p 'MolidoVPN-android-universal.apk' -O old.apk             || gh release download "$PREV" -R "$GITHUB_REPOSITORY" -p 'MobinVPN-android-universal.apk' -O old.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: In-app update on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/android-update-e2e.py old.apk ${{ env.VERSION }}
      - name: Publish screenshots (branch previews-update)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b previews-update
          git config user.name molido-bot && git config user.email molido-bot@users.noreply.github.com
          git add . && git commit -qm "Update e2e screenshots ${{ github.sha }}"
