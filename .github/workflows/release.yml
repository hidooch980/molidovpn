name: Build MolidoVPN Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # Higher than every Flutter-era build (split APK codes were ~2000+run), so this installs as an update.
  VERSION_CODE: ${{ github.run_number }}
  VERSION: 2.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: NDK and CMake
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Rust toolchain for the core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/aether -> target

      - name: Prebuilt Psiphon, Tor and Xray from upstream MSN-GUARD
        run: |
          set -e
          base=https://github.com/mbm110/MSN-GUARD/raw/master/app
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/psiphontunnel-2.0.39.aar "$base/libs/psiphontunnel-2.0.39.aar"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            for lib in libtor.so libobfs4proxy.so libxray.so; do
              curl -fL --retry 3 -o "app/src/main/jniLibs/$abi/$lib" "$base/src/main/jniLibs/$abi/$lib"
            done
          done

      - name: Signing key (same as earlier MolidoVPN releases)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PtargetAbi=arm64-v8a,armeabi-v7a \
            -PaetheryKeystore=release.keystore \
            -PmolidoVersionCode=$((20000 + VERSION_CODE)) \
            -PmolidoVersionName=$VERSION
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*)   cp "$f" dist/MobinVPN-android-arm64.apk ;;
              *armeabi-v7a*) cp "$f" dist/MobinVPN-android-armv7.apk ;;
              *universal*)   cp "$f" dist/MobinVPN-android-universal.apk ;;
            esac
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: molidovpn-android
          path: dist/*
