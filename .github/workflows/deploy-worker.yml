name: Deploy Molido subscription and update Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/sub-worker.js'
      - 'cloudflare/wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Worker routes
        run: node --test cloudflare/app-update.test.mjs cloudflare/catalog-cache.test.mjs cloudflare/live.test.mjs

      - name: Deploy Worker when credentials are configured (optional)
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare deployment skipped: credentials are not configured. GitHub-hosted Android updates do not require this Worker."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml
