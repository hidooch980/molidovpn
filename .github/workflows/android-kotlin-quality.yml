name: Android Kotlin quality

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-kotlin-quality.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-kotlin-quality.yml"

permissions:
  contents: read

concurrency:
  group: android-kotlin-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;26.3.11579264
      - name: Compile Android Kotlin sources
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin \
            -PtargetAbi=arm64-v8a,armeabi-v7a \
            -x :app:buildRustCoreArm64V8a \
            -x :app:buildRustCoreArmeabiV7a
