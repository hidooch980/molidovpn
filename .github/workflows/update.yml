name: Update VPN Subscription

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # lets a run start the next one (GitHub's */15 cron is often delayed or skipped)

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    # Set repository variable RUNNER to a self-hosted runner label (e.g. one inside Iran) to test from there.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install sing-box (latest 1.12.x — same core as the Windows app; needed for AnyTLS)
        run: |
          case "$(uname -m)" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
          TAG=$(gh release list -R SagerNet/sing-box --exclude-pre-releases --limit 100 --json tagName \
                --jq '[.[].tagName | select(startswith("v1.12."))][0]')
          VER=${TAG#v}
          gh release download "$TAG" -R SagerNet/sing-box -p "sing-box-${VER}-linux-${ARCH}.tar.gz" -O sb.tgz
          tar xzf sb.tgz
          echo "SINGBOX_BIN=$PWD/sing-box-${VER}-linux-${ARCH}/sing-box" >> "$GITHUB_ENV"

      - name: Install latest sing-box (compatibility check for Hiddify and other new clients)
        continue-on-error: true
        run: |
          case "$(uname -m)" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
          TAG=$(gh release view -R SagerNet/sing-box --json tagName --jq .tagName)
          VER=${TAG#v}
          mkdir -p latest && cd latest
          gh release download "$TAG" -R SagerNet/sing-box -p "sing-box-${VER}-linux-${ARCH}.tar.gz" -O sb.tgz
          tar xzf sb.tgz
          echo "SINGBOX_LATEST_BIN=$PWD/sing-box-${VER}-linux-${ARCH}/sing-box" >> "$GITHUB_ENV"

      - name: Download GeoIP database (fallback location lookup)
        continue-on-error: true
        run: curl -fsSL -o GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Discover candidate sources (GitHub search, every ~6 hours)
        continue-on-error: true
        run: |
          [ $(( $(date -u +%H) % 6 )) -eq 0 ] && [ $(date -u +%M) -lt 15 ] || exit 0
          gh api -X GET search/repositories -f q='v2ray configs subscription pushed:>'"$(date -u -d '3 days ago' +%F)" \
             -f sort=updated -f per_page=30 --jq '.items[] | .full_name + " " + .default_branch' |
          while read -r repo branch; do
            for path in All_Configs_Sub.txt sub/mix sub.txt configs.txt v2ray.txt All_Configs_base64_Sub.txt; do
              url="https://raw.githubusercontent.com/$repo/$branch/$path"
              curl -fsI -m 8 "$url" >/dev/null 2>&1 && echo "$url"
            done
          done | head -40 >> discover.txt
          sort -u discover.txt -o discover.txt

      - name: Run scanner
        env:
          HEALTH_URL: https://raw.githubusercontent.com/${{ github.repository }}/sub/health.json
        run: python scanner.py

      - name: Publish to 'sub' branch (no history, keeps repo small)
        run: |
          cd output
          git init -q -b sub
          git config user.name "vpn-bot"
          git config user.email "vpn-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "subscription update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sub:sub

      # Same files on GitHub Pages (hidooch980.github.io/vpn-sub/...) — a second address when raw.githubusercontent.com is blocked.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - uses: actions/deploy-pages@v4
        continue-on-error: true

  # Self-scheduling loop: wait, then start the next run. The cron above stays as a backup if the chain breaks.
  schedule-next:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next update in ~15 minutes
        run: |
          sleep 840
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main
