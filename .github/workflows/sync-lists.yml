name: Sync server and policy lists

# Keeps our own copy of the upstream MolidoVPN lists, so the app never depends on
# the upstream repository staying online. The app reads remote/* from this repo.
# Also appends MolidoVPN's own tested servers that fit the SHARD transport
# (VLESS/Trojan over WebSocket+TLS behind Cloudflare), capped so they cannot crowd out upstream nodes.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-lists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream lists (keep the old copy if a download fails)
        run: |
          base=https://raw.githubusercontent.com/mbm110/MSN-GUARD/master/remote
          for f in shard-nodes.txt policy.json smart-split.json; do
            if curl -fsSL --retry 3 -o "/tmp/$f" "$base/$f" && [ -s "/tmp/$f" ]; then
              case "$f" in *.json) python3 -m json.tool "/tmp/$f" >/dev/null || { echo "invalid $f, skipped"; continue; } ;; esac
              cp "/tmp/$f" "remote/$f"
            else
              echo "download failed: $f (kept previous copy)"
            fi
          done

      - name: Append MolidoVPN servers that fit SHARD
        run: |
          python3 - <<'PY'
          import hashlib, ipaddress, json, socket, urllib.parse, urllib.request

          MAX_EXTRA = 30
          SOURCES = [
              "https://molido-sub.hidooch980.workers.dev/",
              "https://raw.githubusercontent.com/hidooch980/vpn-sub/sub/sub.txt",
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")

          cf = [ipaddress.ip_network(n) for n in fetch("https://www.cloudflare.com/ips-v4").split()]

          def behind_cloudflare(name):
              try:
                  ip = ipaddress.ip_address(socket.gethostbyname(name))
              except Exception:
                  return False
              return any(ip in net for net in cf)

          body = ""
          for src in SOURCES:
              try:
                  body = fetch(src)
                  if "://" in body:
                      break
              except Exception as e:
                  print("source failed:", src, e)
          if "://" not in body:
              import base64
              try:
                  body = base64.b64decode(body + "=" * (-len(body) % 4)).decode("utf-8", "ignore")
              except Exception:
                  body = ""

          marker = "# --- MolidoVPN servers ---"
          # Drop last run's MolidoVPN section first, otherwise those nodes count as "existing" and get removed.
          shard = open("remote/shard-nodes.txt", encoding="utf-8").read().split(marker)[0].rstrip("\n") + "\n"
          existing = {l.split("#")[0] for l in shard.splitlines() if "://" in l}

          candidates = []
          for line in body.splitlines():
              line = line.strip()
              scheme = line.split("://", 1)[0].lower()
              if scheme not in ("vless", "trojan"):
                  continue
              u = urllib.parse.urlsplit(line)
              q = dict(urllib.parse.parse_qsl(u.query))
              if q.get("type", "tcp").lower() != "ws" or q.get("security", "").lower() != "tls":
                  continue
              host = q.get("host") or q.get("sni") or u.hostname
              if not host or not u.port or not behind_cloudflare(host):
                  continue
              core = line.split("#")[0]
              if core in existing:
                  continue
              existing.add(core)
              candidates.append(core)

          # Prefer nodes that users' apps report as working (anonymous /scores); unknown nodes get 0.5.
          scores = {}
          try:
              scores = json.loads(fetch("https://molido-sub.hidooch980.workers.dev/scores"))
          except Exception as e:
              print("scores unavailable:", e)

          def rank(core):
              fp = hashlib.sha256(core.strip().encode("utf-8")).hexdigest()[:16]
              s = scores.get(fp)
              if not isinstance(s, dict) or not isinstance(s.get("score"), (int, float)):
                  return (1, -0.5)  # unknown: after known-good, before known-bad
              score = float(s["score"])
              return (0 if score >= 0.6 else 2, -score)

          candidates.sort(key=rank)  # stable: keeps source order within equal ranks
          extra = [c + "#MolidoVPN" for c in candidates[:MAX_EXTRA]]
          print("candidates", len(candidates), "with scores", sum(1 for c in candidates if rank(c)[0] != 1))

          if extra:
              shard += marker + "\n" + "\n".join(extra) + "\n"
          open("remote/shard-nodes.txt", "w", encoding="utf-8").write(shard)
          print("appended", len(extra), "MolidoVPN nodes")
          PY

      - name: Commit changes
        run: |
          git config user.name "molido-bot"
          git config user.email "molido-bot@users.noreply.github.com"
          git add remote
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -q -m "Sync lists $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull -q --rebase
          git push -q

  # GitHub often skips cron on quiet repos, so each run also starts the next one ~6 hours later.
  schedule-next:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next sync in ~5h45m
        run: |
          sleep 20700
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sync-lists.yml --json status --jq '[.[]|select(.status=="queued" or .status=="pending" or .status=="waiting")]|length')
          [ "$waiting" = "0" ] && gh workflow run sync-lists.yml -R "$GITHUB_REPOSITORY" --ref main || echo "a sync is already queued"
