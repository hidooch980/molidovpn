name: Core updates

# Every 6 h: look for new sing-box / Xray-core / Tor / Psiphon / AmneziaWG releases, rewrite the pins in
# tools/core-pins.json (never a workflow file: GITHUB_TOKEN may not push those) and commit
# "Core update: <component> <old> → <new>" to main. That push starts "Build & Release", which is gated by
# the tests and the emulator connection check, so a broken core is never published.
#
# Android: hidooch980/molidovpn-android updates itself (its own core-updates workflow, its own token) and
# commits "Core update (Android): ...". This workflow sees such a commit newer than the last successful
# release and, if mobin-vpn had no change of its own this run, dispatches release.yml. No personal tokens.
#
# Policy and details: tools/check-core-updates.py. Applied versions, attempts and the last dispatched
# Android commit live in .github/core-versions.json; a version is attempted at most once per 24 h.
# Upstream core (Rust core / Android) changes are never merged automatically, only reported in an issue.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: core-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check upstream releases and rewrite pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check-core-updates.py --apply --summary "$RUNNER_TEMP/summary.json"
      - name: Android core updates since the last release
        id: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -s success -L 1 --json startedAt -q '.[0].startedAt // ""')
          echo "last successful release started: ${LAST:-none}"
          Q="repos/hidooch980/molidovpn-android/commits?sha=main&per_page=50"
          [ -n "$LAST" ] && Q="$Q&since=$LAST"
          SHA=$(gh api "$Q" -q '[.[] | select(.commit.message | startswith("Core update (Android)"))][0].sha // ""')
          PREV=$(python -c 'import json;print(json.load(open(".github/core-versions.json")).get("android_dispatch",{}).get("sha",""))')
          echo "android core update commit: ${SHA:-none} (last recorded: ${PREV:-none})"
          if [ -n "$SHA" ] && [ "$SHA" != "$PREV" ]; then
            python - "$SHA" <<'PY'
          import json, sys
          p = ".github/core-versions.json"
          s = json.load(open(p, encoding="utf-8"))
          s["android_dispatch"] = {"sha": sys.argv[1]}
          with open(p, "w", encoding="utf-8", newline="\n") as f:
              json.dump(s, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          MOBIN_MSG=$(jq -r .mobin_commit "$RUNNER_TEMP/summary.json")
          echo "mobin=$MOBIN_MSG" >> "$GITHUB_OUTPUT"
          git config user.name molido-bot
          git config user.email molido-bot@users.noreply.github.com
          git add tools/core-pins.json .github/core-versions.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          if [ -n "$MOBIN_MSG" ]; then
            git commit -m "$MOBIN_MSG"
          else
            # Only bookkeeping (seen upstream versions / dispatched Android commit): do not start a release.
            git commit -m "Core update state [skip ci]"
          fi
          # main may have moved while the check ran (e.g. a manual push): rebase, retry a few times.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 15
          done
          echo "::error::push to main failed after 5 attempts"
          exit 1
      # A push made with GITHUB_TOKEN never starts other workflows, so the release is always dispatched
      # explicitly: after a mobin-vpn core update, or for a new "Core update (Android)" commit.
      - name: Start release
        if: steps.android.outputs.sha != '' || steps.commit.outputs.mobin != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "mobin: '${{ steps.commit.outputs.mobin }}' android: '${{ steps.android.outputs.sha }}' -> dispatching release.yml"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref main
      # GitHub disables scheduled workflows after 60 days without a commit on main.
      - name: Keep schedules alive (empty commit on main every ~30 days)
        continue-on-error: true
        run: |
          git fetch -q origin main
          [ $(( $(date +%s) - $(git log -1 --format=%ct origin/main) )) -ge 2592000 ] || exit 0
          git config user.name molido-bot; git config user.email molido-bot@users.noreply.github.com
          git checkout -q -B keepalive origin/main
          git commit -q --allow-empty -m "keepalive [skip ci]"
          git push -q origin HEAD:main
      - name: Summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/summary.json" ] && { echo '```json'; cat "$RUNNER_TEMP/summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
