name: Update e2e (Android)

on:
  pull_request:
    paths:
      - "tools/android-update-e2e.py"
      - ".github/workflows/update-e2e.yml"
  workflow_dispatch:
    inputs:
      old:
        description: previous release tag (installed first)
        required: true
      new:
        description: version the app must update itself to (without v)
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Old APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.old }}" -R "$GITHUB_REPOSITORY" -p 'MolidoVPN-android-universal.apk' -O old.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/android-update-e2e.py old.apk ${{ inputs.new || '4.0.9' }}
      - name: Upload update-flow screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-update-e2e-screenshots
          path: shots/*.png
          if-no-files-found: ignore
